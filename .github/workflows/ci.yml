name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: swift build
      - run: swift run SketchyControlsCoreChecks
      - run: swift build -c release
      - run: .build/release/SketchyControlsCoreChecks
      - run: bash -n release/package.sh Resources/herdr-open-tailnet-session Companion/scripts/report-vcs-metadata.sh
